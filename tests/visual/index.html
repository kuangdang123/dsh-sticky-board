          function step() {
            var value = null
            try { value = predicate() } catch (error) { reject(error); return }
            if (value) { resolve(value); return }
            if (Date.now() > deadline) { reject(new Error('waitFor timeout')); return }
            setTimeout(step, 30)
          }
          step()
        })
      },
      sleep: function (ms) { return new Promise(function (resolve) { setTimeout(resolve, ms) }) },
    }

    if (params.get('selftest') === '1') {
      var testScript = document.createElement('script')
      testScript.src = 'selftest.js'
      document.head.appendChild(testScript)
    }

    // Expose a selection chip so a screenshot can show the capture affordance.
    // Re-fires a few times: the panel opening can emit a scroll/blur that
    // dismisses the chip, and screenshots must show it reliably.
    [200, 900, 1600, 2300, 3000].forEach(function (delay) {
      setTimeout(function () {
        if (params.get('chip') !== '1') return
        var evidence = document.getElementById('evidence')
        var range = document.createRange()
        range.selectNodeContents(evidence)
        var selection = window.getSelection()
        selection.removeAllRanges()
        selection.addRange(range)
        document.dispatchEvent(new Event('selectionchange', { bubbles: true }))
        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }))
      }, delay)
    })

    // `?surface=1` mimics the chat flow's own selection popover: the bubble is a
    // text-interaction source, the text is selected, and our component is mounted
    // inside a host-styled surface above the selection.
    setTimeout(function () {
      if (params.get('surface') !== '1') return
      var bubble = document.querySelector('.bubble')
      if (bubble) bubble.setAttribute('data-text-interaction-source', '')
      var evidence = document.getElementById('evidence')
      var range = document.createRange()
      range.selectNodeContents(evidence)
      var selection = window.getSelection()
      selection.removeAllRanges()
      selection.addRange(range)
      document.dispatchEvent(new Event('selectionchange', { bubbles: true }))
      document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }))
      mountSurface({ text: evidence.textContent || '' })
      placeSurface(evidence)
    }, 260)

    // `?drop=1` freezes the "drag a note onto the composer" affordance so a
    // screenshot can show the drop ring and the hint pill.
    setTimeout(function () {
      if (params.get('drop') !== '1') return
      var harness = window.__HARNESS__
      if (!harness || !harness.composer || !harness.composer.input) return
      var card = document.querySelector('.dsn-stream .dsn-note')
      if (!card) return
      var dataTransfer = new DataTransfer()
      card.dispatchEvent(new DragEvent('dragstart', { bubbles: true, cancelable: true, dataTransfer: dataTransfer }))
      var input = harness.composer.input
      setTimeout(function () {
        input.dispatchEvent(new DragEvent('dragover', {
          bubbles: true,
          cancelable: true,
          dataTransfer: dataTransfer,
          clientX: 620,
          clientY: 210,
        }))
      }, 140)
    }, 420)

    // `?float=1` pops two notes out of the panel so a screenshot can show the
    // detached windows sitting over the transcript, side by side.
    setTimeout(function () {
      if (params.get('float') !== '1') return
      var harness = window.__HARNESS__
      if (!harness || !harness.floaters) return
      harness.floaters.popOut(0)
      setTimeout(function () { harness.floaters.popOut(1) }, 320)
    }, 520)

    // `?diag=1` dumps computed styles for the panel surfaces into #harness-diag,
    // so `chrome --headless --dump-dom` can be used as a tiny style inspector.
    if (params.get('diag') === '1') {
      setTimeout(function () {
        var selectors = [
          '.dsn-panel', '.dsn-header', '.dsn-header-title', '.dsn-body',
          '.dsn-tabs', '.dsn-tab', '.dsn-tab.is-active', '.dsn-tab-count',
          '.dsn-search', '.dsn-search-input', '.dsn-sections', '.dsn-section-chip',
          '.dsn-section-chip.is-active', '.dsn-section-count',
          '.dsn-composer', '.dsn-editor', '.dsn-composer-hint', '.dsn-composer-foot',
          '.dsn-btn-primary', '.dsn-footer', '.dsn-footer-hint',
          '.dsn-stream', '.dsn-note', '.dsn-note-head', '.dsn-note-age',
          '.dsn-note-kind', '.dsn-note-source', '.dsn-note-clamp',
          '.dsn-content', '.dsn-content li', '.dsn-content table th',
          '.dsn-content table td', '.dsn-content pre', '.dsn-content code',
          '.dsn-chip-layer', '.dsn-capture-chip', '.dsn-surface', '.dsn-surface-btn',
        ]
        var tokens = (window.__DSH_STICKY_BOARD__ && window.__DSH_STICKY_BOARD__.TOKENS) || []
        var bodyStyle = window.getComputedStyle(document.body)
        var resolved = {}
        tokens.forEach(function (name) { resolved[name] = bodyStyle.getPropertyValue(name).trim() })
        var rows = selectors.map(function (selector) {
          var node = document.querySelector(selector)
          if (!node) return { selector: selector, missing: true }
          var style = window.getComputedStyle(node)
          var box = node.getBoundingClientRect()
          return {
            selector: selector,
            color: style.color,
            background: style.backgroundColor,
            borderColor: style.borderColor,
            fontSize: style.fontSize,
            opacity: style.opacity,
            display: style.display,
            visibility: style.visibility,
            zIndex: style.zIndex,
            box: [Math.round(box.left), Math.round(box.top), Math.round(box.width), Math.round(box.height)],
          }
        })
        var diag = document.createElement('pre')
        diag.id = 'harness-diag'
        diag.textContent = JSON.stringify({ theme: theme, tokens: resolved, rows: rows }, null, 1)
        document.body.appendChild(diag)
      }, 400)
    }
  }
})()
</script>
</body>
</html>
